<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a4a">
  <meta name="color-scheme" content="light">
  <title>道历 · 道家黄历</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="logo" aria-hidden="true">☯</div>
      <div>
        <h1>道 历</h1>
        <div class="sub">道 家 黄 历 · 节 日 · 宜 忌</div>
      </div>
      <div class="tagline">观天之道 · 执天之行 · 尽矣</div>
    </header>

    <!-- 手机端 Tab -->
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="today" class="active">今 日</button>
      <button type="button" data-tab="calendar">月 历</button>
    </nav>

    <main class="main">

      <!-- 左：月历 -->
      <section class="card pane" id="pane-calendar">
        <div class="card-inner">
          <div class="cal-head">
            <div class="cal-title">
              <button type="button" id="calYearBtn" title="点击跳转年份">—</button>
              <span id="calMonthLabel">月</span>
            </div>
            <div class="cal-nav">
              <button type="button" class="nav-btn" id="calPrev" title="上个月">‹ 上月</button>
              <button type="button" class="nav-btn" id="calToday" title="回到今天">今</button>
              <button type="button" class="nav-btn" id="calNext" title="下个月">下月 ›</button>
            </div>
          </div>
          <div class="week-row">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="cal-grid" id="calGrid" aria-label="月历网格"></div>
          <div class="element-legend"><span class="wx-wood">木</span><span class="wx-fire">火</span><span class="wx-earth">土</span><span class="wx-metal">金</span><span class="wx-water">水</span></div>
        </div>
      </section>

      <!-- 右：今日详情 -->
      <section class="card pane active" id="pane-today">
        <div class="card-inner">
          <div class="today-hero">
            <div class="solar-date" id="tSolar">—</div>
            <div class="solar-week" id="tWeek">—</div>
            <div class="lunar-date" id="tLunar">—</div>
            <div class="shengxiao" id="tShengxiao"></div>
            <div class="tao-date" id="tTao">—</div>
          </div>

          <div class="ganzhi-grid">
            <div class="gz-cell"><div class="k">年 · 干支</div><div class="v" id="tGzY">—</div></div>
            <div class="gz-cell"><div class="k">月 · 干支</div><div class="v" id="tGzM">—</div></div>
            <div class="gz-cell"><div class="k">日 · 干支</div><div class="v" id="tGzD">—</div></div>
          </div>

          <div class="jieqi-line" id="tJieqi" hidden></div>

          <section class="journal" aria-labelledby="journalHeading">
            <div class="journal-head"><h2 id="journalHeading">每日手记</h2><span id="journalStatus" role="status"></span></div>
            <div id="journalDate"></div>
            <fieldset id="journalFields" disabled>
              <label for="journalMood">今日心情</label>
              <select id="journalMood"><option value="">未记录</option><option>低落</option><option>疲惫</option><option>平静</option><option>愉快</option><option>充沛</option></select>
              <div class="journal-label">五行感受</div>
              <div id="journalElements" class="journal-elements"></div>
              <label for="journalText">今日经历与感受</label>
              <textarea id="journalText" rows="6" maxlength="100000" placeholder="今天发生了什么？身心状态有哪些变化？"></textarea>
            </fieldset>
            <div class="journal-actions">
              <button id="journalExport" type="button">导出备份</button>
              <button id="journalImport" type="button">导入备份</button>
              <button id="journalDelete" type="button">删除当日日记</button>
              <input id="journalFile" type="file" accept=".json,application/json" hidden>
            </div>
          </section>

          <div class="section-title">今日节日</div>
          <div id="tFestivals" class="fest-list"></div>

          <div class="section-title">今日宜忌</div>
          <div class="yiji">
            <div class="col col-yi"><h4>宜</h4><ul id="tYi"></ul></div>
            <div class="col col-ji"><h4>忌</h4><ul id="tJi"></ul></div>
          </div>

          <div class="day-nav">
            <button type="button" id="prevDay">‹ 前一天</button>
            <button type="button" id="nextDay">后一天 ›</button>
            <input type="date" id="datePicker" aria-label="选择日期">
            <button type="button" class="today-btn" id="goToday">今天</button>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">甲子循环 · 阴阳相生 —— 本历纯本地运行，无需网络</footer>
  </div>

  <!-- 节日详情弹窗 -->
  <div class="modal-mask" id="festModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mTitle">节日</h3>
        <button type="button" class="modal-close" id="mClose" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="f-date" id="mDate"></div>
        <div class="f-desc" id="mDesc"></div>
      </div>
    </div>
  </div>

  <!-- 年份跳转弹窗 -->
  <div class="modal-mask" id="yearModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3>跳转年份</h3>
        <button type="button" class="modal-close" id="yClose" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="f-desc">输入公元年份（1 – 9999），月历将跳转到该年当月。</div>
        <div class="year-box">
          <input type="number" id="yearInput" min="1" max="9999" placeholder="如 2026" inputmode="numeric">
          <button type="button" id="yearGo">跳转</button>
        </div>
        <div class="modal-hint">lunar.js 引擎支持公元 1–9999 年，任意年份均可。</div>
      </div>
    </div>
  </div>

  <script src="lunar.js"></script>
  <script src="data.js"></script>
  <script src="journal.js"></script>
  <script src="app.js"></script>
</body>
</html>
